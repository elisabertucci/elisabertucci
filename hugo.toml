baseURL = 'https://elisabertuccidesign.com/'
locale = 'en-us'
title = 'Elisa Bertucci'
theme = 'gallery'
[module]
  [[module.imports]]
    path = "github.com/nicokaiser/hugo-theme-gallery/v4"
[related]
  includeNewer = true
  threshold = 10
  toLower = false
  [[related.indices]]
    applyFilter = false
    cardinalityThreshold = 0
    name = 'categories'
    pattern = ''
    toLower = false
    type = 'basic'
    weight = 10
  [[related.indices]]
    applyFilter = false
    cardinalityThreshold = 0
    name = 'keywords'
    pattern = ''
    toLower = false
    type = 'basic'
    weight = 50
[params]
  defaultTheme = 'dark'   
  [params.socialIcons]
    email = 'mailto:elisamariabertucci@gmail.com'
    linkedin = 'https://linkedin.com/in/elisa-bertucci-885060222'
    behance = "https://behance.net/elisabertucci"