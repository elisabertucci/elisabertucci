baseURL = "https://elisabertuccidesign.com/"
title = "Elisa Bertucci"
theme = "PaperMod"
locale = "en-us"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true
buildDrafts = false
buildFuture = false


[params]
  env = 'production'
  description = 'Portfolio of Elisa Bertucci: service & spatial designer based in Ghent, Belgium, working across research, circular materials and human-centred design.'
  author = 'Elisa Bertucci'
  defaultTheme = 'auto'          # respects visitor's light/dark preference, with a manual toggle

  ShowReadingTime = false
  ShowWordCount = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowToc = false

  mainSections = ['posts', 'portfolio']

  [params.profileMode]
    enabled = true
    title = 'Elisa Bertucci'
    imageUrl = 'images/elisa.jpg'
    imageTitle = 'Elisa Bertucci'
    imageWidth = 150
    imageHeight = 150
    subtitle = '''
Service & spatial designer based in Ghent, Belgium. I recently completed a postgraduate in Space & Service Design at Thomas More Hogeschool, building on a background in product and communication design from Genoa, Italy.

I work where research, materials and people meet: mapping how things are actually used, then prototyping the services, spaces and systems — like material libraries — that make circular ideas practical.

Have a look at what I've been building, or get in touch. I'm open to new opportunities.
'''

    [[params.profileMode.buttons]]
      name = 'Portfolio'
      url = 'portfolio/'
    [[params.profileMode.buttons]]
      name = 'Blog'
      url = 'posts/'
    [[params.profileMode.buttons]]
      name = 'Email me'
      url = 'mailto:elisamariabertucci@gmail.com'

[menu]
  [[menu.main]]
    name = 'About'
    url = '/'
    weight = 1
  [[menu.main]]
    name = 'Portfolio'
    url = '/portfolio/'
    weight = 2
  [[menu.main]]
    name = 'Blog'
    url = '/posts/'
    weight = 3
